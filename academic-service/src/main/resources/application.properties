spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]
server.port=8082
spring.application.name=academic-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/language_center_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
services.auth.url=${AUTH_URL:http://localhost:8081}
services.academic.url=${ACADEMIC_URL:http://localhost:8082}
services.finance.url=${FINANCE_URL:http://localhost:8084}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Status only; no environment, credentials or mappings exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Reject fractional JSON values for integer fields, including expectedMinutes.
spring.jackson.deserialization.accept-float-as-int=false

services.teaching.url=${TEACHING_URL:http://localhost:8083}

# G9 durable notification delivery; provider push remains opt-in.
notifications.jobs.enabled=${NOTIFICATION_JOBS_ENABLED:true}

notifications.push.enabled=${NOTIFICATIONS_PUSH_ENABLED:false}
notifications.expo.project-id=${EXPO_PROJECT_ID:}
notifications.expo.access-token=${EXPO_PUSH_ACCESS_TOKEN:}
