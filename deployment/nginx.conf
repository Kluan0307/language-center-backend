# Same-host deployment; frontend dist is copied into <release>/frontend.
# Run nginx from the release directory; replace listen with your TLS virtual host for public deployment.
worker_processes auto;
events { worker_connections 1024; }
http {
  types {
    text/html html;
    text/css css;
    application/javascript js;
    application/json json;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/x-icon ico;
    font/woff2 woff2;
  }
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  server {
    listen 127.0.0.1:8090;
    root frontend;
    index index.html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/v1/ {
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 20s;
      add_header Cache-Control no-store always;
    }
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control no-cache always;
    }
    # Do not proxy /actuator or any physical document directory.
    location /actuator { return 404; }
    location ~ /\. { deny all; }
  }
}
