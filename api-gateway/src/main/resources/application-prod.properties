# Secrets are supplied by environment, never baked into the artifact.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.file.name=${LOG_FILE:./logs/api-gateway.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
