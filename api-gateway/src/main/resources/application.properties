spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]
server.port=8080
spring.application.name=api-gateway
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=academic-service
spring.cloud.gateway.server.webflux.routes[1].uri=${ACADEMIC_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/academic/**
spring.cloud.gateway.server.webflux.routes[2].id=teaching-service
spring.cloud.gateway.server.webflux.routes[2].uri=${TEACHING_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/teaching/**
spring.cloud.gateway.server.webflux.routes[3].id=finance-service
spring.cloud.gateway.server.webflux.routes[3].uri=${FINANCE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/finance/**
spring.cloud.gateway.server.webflux.routes[4].id=assistant-service
spring.cloud.gateway.server.webflux.routes[4].uri=${ASSISTANT_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/assistant/**
# Only assistant gets a 40-second route timeout; other routes keep their existing limits.
spring.cloud.gateway.server.webflux.routes[4].metadata.response-timeout=40000
# Gateway handles CORS. Services retain CORS for direct local development.
spring.cloud.gateway.server.webflux.default-filters[0]=RemoveRequestHeader=Origin
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s
# Status only; no environment, credentials or mappings exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
