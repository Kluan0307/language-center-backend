worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    map "$status:$uri" $cache_policy {
        default "no-store";
        ~^200:/assets/ "public, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway_origin http://api-gateway:8080;
        client_max_body_size 12m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $cache_policy always;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        location = /healthz { default_type application/json; return 200 '{"status":"UP"}'; }
        location ^~ /api/ {
            proxy_pass $gateway_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
            proxy_hide_header Cache-Control;
        }
        location ^~ /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
