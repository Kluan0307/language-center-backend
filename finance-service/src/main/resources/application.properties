spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]
server.port=8084
spring.application.name=finance-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/language_center_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
services.auth.url=${AUTH_URL:http://localhost:8081}
services.academic.url=${ACADEMIC_URL:http://localhost:8082}
services.finance.url=${FINANCE_URL:http://localhost:8084}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Status only; no environment, credentials or mappings exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# G8: VNPAY sandbox is disabled until merchant credentials and HTTPS return URL exist.
payment.vnpay.enabled=${VNPAY_ENABLED:false}
payment.vnpay.merchant-code=${VNPAY_TMN_CODE:}
payment.vnpay.secret=${VNPAY_HASH_SECRET:}
payment.vnpay.return-url=${VNPAY_RETURN_URL:}
payment.vnpay.checkout-url=${VNPAY_CHECKOUT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.query-url=${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
payment.vnpay.server-ip=${VNPAY_SERVER_IP:127.0.0.1}
payment.vnpay.ttl-minutes=${VNPAY_TTL_MINUTES:15}
payment.jobs.enabled=${PAYMENT_JOBS_ENABLED:true}

# G9 durable notification delivery; provider push remains opt-in.
notifications.jobs.enabled=${NOTIFICATION_JOBS_ENABLED:true}
