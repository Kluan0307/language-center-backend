server.address=${SERVER_ADDRESS:0.0.0.0}
spring.config.import=optional:file:/run/secrets/language-center.properties
logging.file.name=
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/language_center_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:language_center_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
services.auth.url=${AUTH_URL:http://auth-service:8081}
services.academic.url=${ACADEMIC_URL:http://academic-service:8082}
services.teaching.url=${TEACHING_URL:http://teaching-service:8083}
services.finance.url=${FINANCE_URL:http://finance-service:8084}
auth.bootstrap.enabled=false
teaching.storage.path=${DOCUMENT_STORAGE:/app/data/documents}
