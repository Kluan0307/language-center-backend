spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]
spring.application.name=assistant-service
server.address=127.0.0.1
server.port=${ASSISTANT_PORT:8086}
services.auth.url=${AUTH_URL:http://localhost:8081}
services.academic.url=${ACADEMIC_URL:http://localhost:8082}
services.teaching.url=${TEACHING_URL:http://localhost:8083}
services.finance.url=${FINANCE_URL:http://localhost:8084}
assistant.mcp.enabled=${ASSISTANT_MCP_ENABLED:false}
assistant.mcp.max-connections=16
assistant.mcp.session-ttl-seconds=120
assistant.chat.enabled=${ASSISTANT_CHAT_ENABLED:false}
assistant.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:10}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
# MCP payloads may contain student names. Never enable SDK/HTTP body logging.
logging.level.io.modelcontextprotocol=OFF
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
spring.mvc.log-request-details=false
assistant.limits.requests-per-minute=${ASSISTANT_REQUESTS_PER_MINUTE:30}
assistant.limits.model-calls-per-minute=${ASSISTANT_MODEL_CALLS_PER_MINUTE:12}
assistant.limits.global-model-calls-per-minute=${ASSISTANT_GLOBAL_MODEL_CALLS_PER_MINUTE:120}
assistant.limits.concurrent-per-account=${ASSISTANT_CONCURRENT_PER_ACCOUNT:2}
logging.level.root=INFO
logging.file.name=${ASSISTANT_LOG_FILE:../storage/assistant-service.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=70MB
